name: CI

on:
  push:
    branches: [ main, 8.x ]
  pull_request:
    branches: [ main, 8.x ]
  schedule:
    - cron: '0 0 * * *' # Daily at midnight UTC

jobs:
  phpstan:
    name: PHPStan (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.4']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          tools: composer
      
      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction
      
      - name: Run PHPStan
        run: composer test:types

  tests:
    name: PHPUnit Tests (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.4']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          tools: composer
      
      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction
      
      - name: Run PHPUnit tests
        run: composer test:unit

  rector:
    name: Rector Check (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.4']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          tools: composer
      
      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction
      
      - name: Run Rector (check mode)
        run: composer rector:check

  check:
    if: always()
    needs:
      - phpstan
      - tests
      - rector
    runs-on: ubuntu-latest
    
    steps:
      - name: Check if all jobs are passing
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
