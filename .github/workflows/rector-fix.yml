name: Auto-fix Rector Issues

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main
      - 8.x

jobs:
  auto-fix:
    name: Auto-fix Rector Issues
    runs-on: ubuntu-latest
    # Only run if CI failed and it's triggered by a pull request
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.event == 'pull_request' }}
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer
      
      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction
      
      - name: Check if Rector fixes are needed
        id: check-rector
        run: |
          set +e
          OUTPUT=$(composer rector:check 2>&1)
          EXIT_CODE=$?
          
          if echo "$OUTPUT" | grep -qE "files would have been changed|would have been changed"; then
            echo "needs_fix=true" >> $GITHUB_OUTPUT
            echo "Rector found issues that can be auto-fixed"
          else
            echo "needs_fix=false" >> $GITHUB_OUTPUT
            echo "No Rector fixes needed or Rector check passed"
          fi
          exit 0
      
      - name: Apply Rector fixes
        if: steps.check-rector.outputs.needs_fix == 'true'
        run: composer rector:fix
      
      - name: Check for changes
        if: steps.check-rector.outputs.needs_fix == 'true'
        id: check-changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected after Rector fixes"
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes after Rector fixes"
          fi
      
      - name: Commit and push changes
        if: steps.check-rector.outputs.needs_fix == 'true' && steps.check-changes.outputs.has_changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          git commit -m "chore: apply Rector automatic fixes [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
